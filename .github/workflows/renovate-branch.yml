# Reusable workflow, for each Renovate branch: copies @dume/dev-config's files into the repository (dev-config sync),
# adds the changesets of the updated dependencies when the repository uses Changesets, then runs the repository's
# checks on the branch's last commit and reports them as one commit status.
#
# Renovate merges its updates without a pull request (automergeType "branch", renovate/default.json), so the
# repository's CI, run on pull requests, does not run on them; nor on a commit pushed with GITHUB_TOKEN: the "checks"
# input runs them here instead, on the branch's last commit, reported as pending first so that Renovate waits for
# them. With "changesets", the repository needs @scaleway/changesets-renovate as a dependency.
#
# on:
#   push:
#     branches: ['renovate/**']
# jobs:
#   renovate:
#     uses: smndhm/dev-config/.github/workflows/renovate-branch.yml@<commit SHA> # main
#     permissions:
#       contents: write
#       statuses: write
#     with:
#       changesets: true
#       checks: |
#         pnpm lint
#         pnpm test

name: Renovate branch

on:
  workflow_call:
    inputs:
      changesets:
        description: Add the changesets of the updated dependencies (repositories versioned with Changesets)
        type: boolean
        default: false
      checks:
        description: The repository's checks, a shell script run on the changeset commit (one command per line, stops at the first failure)
        required: true
        type: string

permissions:
  contents: write # Push the commit
  statuses: write # Report the checks on the commit

jobs:
  renovate-branch:
    name: Sync and changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: smndhm/dev-config/ci/setup@4174cbd36b89719d9ef41d66f28ea288d2e0e951 # main

      # The files of @dume/dev-config, which Claude Code and git read before anything is installed
      - name: Copy @dume/dev-config's files
        run: if [ -x node_modules/.bin/dev-config ]; then pnpm exec dev-config sync; fi

      - name: Generate changesets for the updated dependencies
        if: inputs.changesets
        run: pnpm exec changesets-renovate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit
        id: commit
        run: |
          # Authored by Renovate so that Renovate keeps rebasing the branch
          export GIT_AUTHOR_NAME="renovate[bot]" GIT_AUTHOR_EMAIL="renovate[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="renovate[bot]" GIT_COMMITTER_EMAIL="renovate[bot]@users.noreply.github.com"
          for path in .changeset .claude .husky; do if [ -e "$path" ]; then git add --all "$path"; fi; done
          if git commit -m "chore: changesets and @dume/dev-config files for renovate"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to commit"
          fi

      # Pending until the checks end: Renovate does not merge a branch whose last commit has no status yet
      - name: Report pending status
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state=pending -f context="Renovate branch checks" \
            -f description="The repository's checks on the branch's last commit" -f target_url="$TARGET_URL"

      - name: Checks
        id: checks
        run: bash -eo pipefail -c "$CHECKS"
        env:
          CHECKS: ${{ inputs.checks }}

      - name: Report status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.checks.outcome == 'success' && 'success' || 'failure' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$STATE" -f context="Renovate branch checks" \
            -f description="The repository's checks on the branch's last commit" -f target_url="$TARGET_URL"

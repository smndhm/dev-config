name: Renovate branch

on:
  push:
    branches:
      - 'renovate/**'

jobs:
  # This repository's own reusable workflow, as in the other repositories
  renovate-branch:
    uses: ./.github/workflows/renovate-branch.yml
    permissions:
      contents: write
      statuses: write
    with:
      changesets: true
      checks: |
        pnpm lint
        pnpm test

# Reusable workflow: on a Renovate branch, adds the changesets of the updated dependencies, then runs the
# repository's checks on that commit and reports them as one commit status.
#
# A commit pushed with GITHUB_TOKEN does not trigger the repository's CI, so Renovate would automerge it
# without checks: the "checks" input runs them here instead. The repository needs
# @scaleway/changesets-renovate as a dependency.
#
# on:
#   push:
#     branches: ['renovate/**']
# jobs:
#   changesets:
#     uses: smndhm/dev-config/.github/workflows/changesets-renovate.yml@<commit SHA>
#     permissions:
#       contents: write
#       statuses: write
#     with:
#       checks: |
#         pnpm lint
#         pnpm test

name: Renovate → Changesets

on:
  workflow_call:
    inputs:
      checks:
        description: The repository's checks, a shell script run on the changeset commit (one command per line, stops at the first failure)
        required: true
        type: string

permissions:
  contents: write # Push the changeset commit
  statuses: write # Report the checks on the changeset commit

jobs:
  changesets:
    name: Add changeset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: smndhm/dev-config/.github/actions/setup@2e579ed1cd0c22cf6390b943b85036d7cc4dfda7 # main

      - name: Generate changesets for the updated dependencies
        run: pnpm exec changesets-renovate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changesets
        id: commit
        run: |
          # Authored by Renovate so that Renovate keeps rebasing the branch
          export GIT_AUTHOR_NAME="renovate[bot]" GIT_AUTHOR_EMAIL="renovate[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="renovate[bot]" GIT_COMMITTER_EMAIL="renovate[bot]@users.noreply.github.com"
          git add .changeset
          if git commit -m "chore(changesets): add changeset for renovate"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changeset to commit"
          fi

      - name: Checks
        id: checks
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        run: bash -eo pipefail -c "$CHECKS"
        env:
          CHECKS: ${{ inputs.checks }}

      - name: Report status
        if: ${{ always() && steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ steps.checks.outcome == 'success' && 'success' || 'failure' }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/${{ github.repository }}/statuses/$(git rev-parse HEAD)" \
            -f state="$STATE" -f context="Renovate changeset checks" \
            -f description="The repository's checks on the changeset commit" -f target_url="$TARGET_URL"

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write # Push the changeset-release/main branch and create releases
  pull-requests: write # Open the "Version Packages" pull request
  id-token: write # npm trusted publishing: no npm token

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./ci/setup

      # Opens the "Version Packages" pull request, or publishes to npm once it is merged
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          publish-script: pnpm changeset:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}

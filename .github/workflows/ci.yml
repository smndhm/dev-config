name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./ci/setup

      - name: Lint and format check
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Renovate preset
        run: pnpm dlx --package renovate@43.288.0 renovate-config-validator renovate/default.json default.json renovate.json
